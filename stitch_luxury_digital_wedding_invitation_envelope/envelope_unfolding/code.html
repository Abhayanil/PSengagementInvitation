  <style>
    .material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }

    .envelope-stage {
      perspective: 1200px;
    }

    .unfold-flap {
      transform-origin: bottom center;
      transition: transform 650ms cubic-bezier(0.2, 0, 0, 1), opacity 450ms ease-out;
    }

    .unfold-flap.is-open {
      transform: rotateX(0deg);
      opacity: 1;
    }

    .unfold-flap.is-closed {
      transform: rotateX(-165deg);
      opacity: 0.4;
    }

    .emerging-card {
      box-shadow: 0 16px 34px -10px rgba(30, 27, 22, 0.20), 0 4px 10px rgba(65, 45, 0, 0.08);
      transition: transform 700ms cubic-bezier(0.2, 0, 0, 1), opacity 500ms ease-out;
    }

    .emerging-card.is-tucked {
      transform: translateY(80px) scale(0.95);
      opacity: 0;
    }

    .emerging-card.is-revealed {
      transform: translateY(0px) scale(1);
      opacity: 1;
    }

    .envelope-drop-shadow {
      box-shadow: 0 24px 48px -14px rgba(30, 27, 22, 0.18), 0 8px 18px -6px rgba(65, 45, 0, 0.10);
    }

    .wax-seal-shadow {
      filter: drop-shadow(0 6px 10px rgba(30, 27, 22, 0.24));
    }

    .wax-deboss-text {
      text-shadow: 0 1px 0 rgba(233, 193, 118, 0.55), 0 -1px 1px rgba(65, 45, 0, 0.5);
    }

    @media (prefers-reduced-motion: reduce) {
      .unfold-flap,
      .emerging-card {
        transition: none !important;
      }
    }
  </style>

  <script>
    (function () {
      var flap = document.getElementById('top-flap-layer');
      var card = document.getElementById('invitation-card');
      var replayBtn = document.getElementById('replay-unfold-btn');
      if (!flap || !card || !replayBtn) return;

      function playUnfoldSequence() {
        flap.classList.remove('is-open');
        flap.classList.add('is-closed');
        card.classList.remove('is-revealed');
        card.classList.add('is-tucked');

        setTimeout(function () {
          flap.classList.remove('is-closed');
          flap.classList.add('is-open');
        }, 160);

        setTimeout(function () {
          card.classList.remove('is-tucked');
          card.classList.add('is-revealed');
        }, 380);
      }

      replayBtn.addEventListener('click', playUnfoldSequence);
    })();
  </script>
